<!doctype html><meta charset="utf-8"><title>DineVista marker compiler</title><style>body{font:16px sans-serif;padding:2rem}textarea{width:100%;height:40vh}</style><h1>Compiling demo marker</h1><p id="status">Loading compiler…</p><textarea id="output" aria-label="Compiled marker data"></textarea><script src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/dist/mindar-image.prod.js"></script><script>
(async()=>{const status=document.querySelector('#status'),output=document.querySelector('#output');try{const blob=await(await fetch('/ar/marker.jpg')).blob();const image=await createImageBitmap(blob);const compiler=new MINDAR.IMAGE.Compiler();await compiler.compileImageTargets([image],p=>status.textContent=`Compiling ${p.toFixed(1)}%`);const data=new Uint8Array(await compiler.exportData());let binary='';for(let i=0;i<data.length;i+=0x8000)binary+=String.fromCharCode(...data.subarray(i,i+0x8000));output.value=btoa(binary);status.textContent=`DONE ${data.length} bytes`;}catch(error){status.textContent=`ERROR ${error.message}`;}})();
</script>
